# ==============================================================================
# systemd-tmpfiles configuration template
# ==============================================================================
# Installed to: %{_tmpfilesdir}/<name>.conf  (/usr/lib/tmpfiles.d/<name>.conf)
# Manual sync:  systemd-tmpfiles --create [<name>.conf]
#
# Field Definitions:
#   Type  Path              Mode  User    Group   Age  Argument
#   d     /run/<name>       0750  <name>  <name>  -    -
#   d     /var/lib/<name>   0750  <name>  <name>  -    -
#   d     /var/log/<name>   0750  <name>  <name>  -    -
#   d     /etc/<name>       0750  <name>  <name>  -    -
#   z     /etc/<name>/*     0640  <name>  <name>  -    -
#
# Common Types:
#   d : Create directory if it does not exist, set mode/ownership if specified.
#   D : Create directory or empty existing directory on boot.
#   z : Adjust mode and ownership on existing files/directories (non-recursive).
#   Z : Adjust mode and ownership recursively on existing files/directories.
#   e : Clean up directory contents based on age parameter.
#
# Notes on Cross-Distribution Compatibility (RHEL & Ubuntu/Debian):
#   - Validated on systemd v239+ (RHEL 8/9/10, Ubuntu 20.04/22.04/24.04, Debian 11/12).
#   - Restrictive permissions (0750 for dirs, 0640 for sensitive configs) comply
#     with CIS Linux benchmarks and Debian/RHEL security standards.
#   - /run/<name> manages volatile RAM tmpfs (never use deprecated /var/run).
#   - Complements systemd service RuntimeDirectory=, StateDirectory=, LogsDirectory=, ConfigurationDirectory=.
# ==============================================================================

#Type Path              Mode User    Group   Age Argument
d     /run/<name>       0750 <name>  <name>  -   -
d     /var/lib/<name>   0750 <name>  <name>  -   -
d     /var/log/<name>   0750 <name>  <name>  -   -
d     /etc/<name>       0750 <name>  <name>  -   -
z     /etc/<name>/*     0640 <name>  <name>  -   -

