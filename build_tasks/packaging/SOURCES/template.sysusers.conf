# ==============================================================================
# systemd-sysusers configuration template
# ==============================================================================
# Installed to: %{_sysusersdir}/<name>.conf  (/usr/lib/sysusers.d/<name>.conf)
# Manual sync:  systemd-sysusers [<name>.conf]
#
# Field Definitions:
#   Type  Name    ID  GECOS                    Home directory   Shell
#   u     <name>  -   "<summary_description>"  /var/lib/<name>  -
#
# Notes on Cross-Distribution Compatibility (RHEL & Ubuntu/Debian):
#   - Type 'u': Creates both a system user and a system group with the same name.
#   - ID '-': Allocates the next available dynamic system UID/GID (< 1000).
#   - Home: Set to persistent data directory (/var/lib/<name>) or /var/empty.
#   - Shell '-': Uses the distribution-configured nologin shell:
#                * RHEL / CentOS / Fedora: /sbin/nologin (or /usr/sbin/nologin)
#                * Debian / Ubuntu:        /usr/sbin/nologin
#                Using '-' avoids hardcoding distro-specific paths and prevents
#                account creation errors across distributions.
# ==============================================================================

#Type Name    ID  GECOS                     Home directory   Shell
u     <name>  -   "<description_of_daemon>" /var/lib/<name>  -

